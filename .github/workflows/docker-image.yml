name: Build and Push Docker Image

# 触发条件：push 到 main/master 分支，或打 tag（v*）时构建
on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'

# 环境变量集中定义
env:
  REGISTRY: ghcr.io
  # 镜像名格式：ghcr.io/<owner>/<repo>，须全小写
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 镜像名转小写（GHCR 要求），输出为小写全名
      - name: Normalize image name to lowercase
        id: img
        run: |
          echo "name=${IMAGE_NAME,,}" >> "$GITHUB_OUTPUT"
        env:
          IMAGE_NAME: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      # 设置 QEMU，支持多架构构建（可选，本服务仅 amd64 也可去掉）
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 登录到 GitHub Container Registry
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 生成镜像元数据（含 tag 与 label）
      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.img.outputs.name }}
          tags: |
            # 打 tag 推送（v1.2.3 -> 1.2.3、1.2、1、latest）
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            # 分支 push 或 tag push 都附加短 commit sha，便于回滚定位
            type=sha,format=short

      # 分支 push 时，额外打 latest 标签（用独立步骤动态计算，避免 metadata-action 表达式求值限制）
      - name: Set latest tag for branch pushes
        id: latest
        if: github.ref_type == 'branch'
        run: |
          echo "tag=${{ steps.img.outputs.name }}:latest" >> "$GITHUB_OUTPUT"

      # 构建并推送镜像
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ steps.meta.outputs.tags }}
            ${{ steps.latest.outputs.tag }}
          labels: ${{ steps.meta.outputs.labels }}
          # 启用缓存，加速后续构建
          cache-from: type=gha
          cache-to: type=gha,mode=max
